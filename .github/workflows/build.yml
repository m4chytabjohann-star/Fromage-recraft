name: Build PS1
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu python3 python3-numpy python3-scipy python3-pil genisoimage git
          sudo ln -sf /usr/bin/mipsel-linux-gnu-gcc /usr/bin/mipsel-elf-gcc
          sudo ln -sf /usr/bin/mipsel-linux-gnu-ld /usr/bin/mipsel-elf-ld
          sudo ln -sf /usr/bin/mipsel-linux-gnu-objcopy /usr/bin/mipsel-elf-objcopy
          sudo ln -sf /usr/bin/mipsel-linux-gnu-ar /usr/bin/mipsel-elf-ar
          git clone "https://github.com""/ChenThread/candyk-psx.git" ../candyk-psx
          make -C ../candyk-psx TOOLCHAIN=mipsel-linux-gnu-
      - name: Build
        run: |
          mkdir -p obj
          make CANDYK=../candyk-psx TOOLCHAIN=mipsel-linux-gnu-
      - uses: actions/upload-artifact@v4
        with:
          name: Fromage-PS1
          path: |
            fromage.bin
            fromage.cue
